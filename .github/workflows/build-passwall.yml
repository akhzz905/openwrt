name: Build OpenWrt for GL-AXT1800 with PassWall 2

on:
  workflow_dispatch: # 支持网页手动点击运行

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Initialize Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt update -y
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget

      - name: Update & Install Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          # 编译时动态拉取最新版 luci-app-cpufreq
          git clone --depth 1 https://github.com/openwrt-xiaomi/luci-app-cpufreq.git package/luci-app-cpufreq

      - name: Generate Configuration for GL-AXT1800
        run: |
          # 1. 关键：指定 GL-AXT1800 目标架构与机型代码
          echo "CONFIG_TARGET_qualcommax=y" >> .config
          echo "CONFIG_TARGET_qualcommax_ipq60xx=y" >> .config
          echo "CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_glinet_gl-axt1800=y" >> .config

          # 2. 预装 Web 界面（LuCI）与中文语言包
          echo "CONFIG_PACKAGE_luci=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-base-zh-cn=y" >> .config

          # 3. 预装 SD卡、USB 存储与自动挂载组件（彻底解决你的 SD 卡识别问题）
          echo "CONFIG_PACKAGE_block-mount=y" >> .config
          echo "CONFIG_PACKAGE_kmod-fs-ext4=y" >> .config
          echo "CONFIG_PACKAGE_e2fsprogs=y" >> .config
          echo "CONFIG_PACKAGE_kmod-usb-storage=y" >> .config

          # 4. 替换默认 dnsmasq 为增强版 dnsmasq-full
          echo "CONFIG_PACKAGE_dnsmasq=n" >> .config
          echo "CONFIG_PACKAGE_dnsmasq-full=y" >> .config

          # 5. 关键：直接指定实体核心软件包（生成 /usr/bin/xray 等内核）
          echo "CONFIG_PACKAGE_xray-core=y" >> .config
          echo "CONFIG_PACKAGE_sing-box=y" >> .config
          echo "CONFIG_PACKAGE_chinadns-ng=y" >> .config
          echo "CONFIG_PACKAGE_v2ray-geoip=y" >> .config
          echo "CONFIG_PACKAGE_v2ray-geosite=y" >> .config

          # 6. 预装 PassWall 2 界面、全核心支持及 nftables 转发
          echo "CONFIG_PACKAGE_luci-app-passwall2=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-passwall2_Basic_Core_All=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-passwall2_Nftables_Transparent_Proxy=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-passwall2-zh-cn=y" >> .config

          # 7. 底层内核转发依赖与 HTTPS 证书
          echo "CONFIG_PACKAGE_kmod-nft-tproxy=y" >> .config
          echo "CONFIG_PACKAGE_kmod-nft-socket=y" >> .config
          echo "CONFIG_PACKAGE_kmod-nft-nat=y" >> .config
          echo "CONFIG_PACKAGE_ca-bundle=y" >> .config

          # 8. 预装 ImmortalWrt 自带的 CPU 频率调节插件 (luci-app-cpufreq)
          echo "CONFIG_PACKAGE_luci-app-cpufreq=y" >> .config

          # 自动补全所有级联依赖并生成有效配置
          make defconfig

      - name: Download Packages
        run: |
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile Firmware
        run: |
          make -j$(nproc) || make -j1 V=s

      - name: Upload Firmware to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GL-AXT1800-OpenWrt-Passwall2
          # 只提取 AXT1800 专用的固件包，避免上传无用的调试符号
          path: bin/targets/qualcommax/ipq60xx/*gl-axt1800*
